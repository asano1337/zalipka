<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Круги Эйлера - Задание 13</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- SVG 画布 -->
    <svg width="550" height="300" xmlns="http://www.w3.org/2000/svg">
        
        <!-- 全集 U (矩形) -->
        <rect x="20" y="20" width="510" height="240" fill="#fafafa" stroke="#333" stroke-width="2" stroke-dasharray="8,4" rx="10"/>
        <text x="510" y="45" font-size="22" font-weight="bold" fill="#333">U</text>

        <!-- 圆 A (日文汉字) -->
        <circle cx="120" cy="130" r="70" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3"/>
        <text x="120" y="125" font-size="26" font-weight="bold" fill="#1e88e5" text-anchor="middle" dominant-baseline="middle">A</text>
        <text x="120" y="150" font-size="12" fill="#555" text-anchor="middle">японские</text>
        <text x="120" y="165" font-size="12" fill="#555" text-anchor="middle">иероглифы</text>

        <!-- 圆 B (俄文字母) -->
        <circle cx="275" cy="130" r="70" fill="#e8f5e9" stroke="#43a047" stroke-width="3"/>
        <text x="275" y="125" font-size="26" font-weight="bold" fill="#43a047" text-anchor="middle" dominant-baseline="middle">B</text>
        <text x="275" y="150" font-size="12" fill="#555" text-anchor="middle">буквы рус.</text>
        <text x="275" y="165" font-size="12" fill="#555" text-anchor="middle">алфавита</text>

        <!-- 圆 C (英文字母) -->
        <circle cx="430" cy="130" r="70" fill="#fff3e0" stroke="#fb8c00" stroke-width="3"/>
        <text x="430" y="125" font-size="26" font-weight="bold" fill="#fb8c00" text-anchor="middle" dominant-baseline="middle">C</text>
        <text x="430" y="150" font-size="12" fill="#555" text-anchor="middle">буквы англ.</text>
        <text x="430" y="165" font-size="12" fill="#555" text-anchor="middle">алфавита</text>

    </svg>
</div>

</body>
</html>
